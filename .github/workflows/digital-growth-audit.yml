name: Digital Growth and Monetisation audit
run-name: Digital Growth - ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Audit session id
        required: true
        type: string
      report_prefix:
        description: Temporary R2 prefix under the dedicated audits bucket
        required: true
        type: string
      base_url:
        description: Live base URL
        required: true
        default: https://jonathan-harris.online
        type: string
      exclude_prefixes:
        description: Comma-separated route prefixes to exclude
        required: false
        default: ""
        type: string
      callback_url:
        description: AI Management Suite callback URL
        required: false
        default: https://app.jonathan-harris.online/audits/digital-growth/callback
        type: string
      analysis_url:
        description: Optional AI Management Suite analysis URL override
        required: false
        default: ""
        type: string
      callback_token:
        description: AI Management Suite callback token supplied by Koyeb dispatch
        required: false
        default: ""
        type: string
      audit_bucket:
        description: Dedicated audits R2 bucket name
        required: false
        default: ""
        type: string
      audit_public_base_url:
        description: Dedicated audits R2 public base URL
        required: false
        default: ""
        type: string
      audit_bucket_env:
        description: Compatibility input; must be R2_BUCKET_AUDITS
        required: false
        default: R2_BUCKET_AUDITS
        type: string
      audit_public_base_env:
        description: Compatibility input; must be R2_PUBLIC_BASE_URL_AUDITS
        required: false
        default: R2_PUBLIC_BASE_URL_AUDITS
        type: string

permissions:
  contents: read

jobs:
  digital-growth:
    environment: R2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      AUDIT_CALLBACK_TOKEN: ${{ secrets.AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_TOKEN: ${{ secrets.AI_SUITE_AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_URL: ${{ vars.AI_SUITE_AUDIT_CALLBACK_URL }}
      INPUT_SESSION_ID: ${{ inputs.session_id }}
      INPUT_REPORT_PREFIX: ${{ inputs.report_prefix }}
      INPUT_BASE_URL: ${{ inputs.base_url }}
      INPUT_EXCLUDE_PREFIXES: ${{ inputs.exclude_prefixes }}
      INPUT_CALLBACK_URL: ${{ inputs.callback_url }}
      INPUT_ANALYSIS_URL: ${{ inputs.analysis_url }}
      INPUT_CALLBACK_TOKEN: ${{ inputs.callback_token }}
      INPUT_AUDIT_BUCKET: ${{ inputs.audit_bucket }}
      INPUT_AUDIT_PUBLIC_BASE_URL: ${{ inputs.audit_public_base_url }}
      INPUT_AUDIT_BUCKET_ENV: ${{ inputs.audit_bucket_env }}
      INPUT_AUDIT_PUBLIC_BASE_ENV: ${{ inputs.audit_public_base_env }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check boto3 requests beautifulsoup4 openpyxl

      - name: Validate workflow-dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audits/validate_workflow_inputs.py --callback-suffix "/audits/digital-growth/callback"

      - name: Resolve callback and dedicated audits bucket
        shell: bash
        run: |
          set -euo pipefail
          callback_url="$INPUT_CALLBACK_URL"
          [ -n "$callback_url" ] || callback_url="$AI_SUITE_AUDIT_CALLBACK_URL"
          [ -n "$callback_url" ] || callback_url="https://app.jonathan-harris.online/audits/digital-growth/callback"
          case "$callback_url" in
            */audits/digital-growth/callback) ;;
            *) echo "::error::callback_url must end with /audits/digital-growth/callback; got $callback_url"; exit 1 ;;
          esac

          callback_token="$INPUT_CALLBACK_TOKEN"
          [ -n "$callback_token" ] || callback_token="$AUDIT_CALLBACK_TOKEN"
          [ -n "$callback_token" ] || callback_token="$AI_SUITE_AUDIT_CALLBACK_TOKEN"
          [ -n "$callback_token" ] || { echo "::error::Audit callback token is required"; exit 1; }

          audit_bucket="$INPUT_AUDIT_BUCKET"
          [ -n "$audit_bucket" ] || audit_bucket="${{ secrets.R2_BUCKET_AUDITS }}"
          [ -n "$audit_bucket" ] || audit_bucket="${{ vars.R2_BUCKET_AUDITS }}"
          [ -n "$audit_bucket" ] || { echo "::error::R2_BUCKET_AUDITS is required"; exit 1; }

          audit_public_base_url="$INPUT_AUDIT_PUBLIC_BASE_URL"
          [ -n "$audit_public_base_url" ] || audit_public_base_url="${{ secrets.R2_PUBLIC_BASE_URL_AUDITS }}"
          [ -n "$audit_public_base_url" ] || audit_public_base_url="${{ vars.R2_PUBLIC_BASE_URL_AUDITS }}"
          [ -n "$audit_public_base_url" ] || { echo "::error::R2_PUBLIC_BASE_URL_AUDITS is required"; exit 1; }

          [ "$INPUT_AUDIT_BUCKET_ENV" = "R2_BUCKET_AUDITS" ] || { echo "::error::audit_bucket_env must be R2_BUCKET_AUDITS"; exit 1; }
          [ "$INPUT_AUDIT_PUBLIC_BASE_ENV" = "R2_PUBLIC_BASE_URL_AUDITS" ] || { echo "::error::audit_public_base_env must be R2_PUBLIC_BASE_URL_AUDITS"; exit 1; }

          echo "::add-mask::$callback_token"
          echo "RESOLVED_CALLBACK_URL=$callback_url" >> "$GITHUB_ENV"
          echo "R2_BUCKET_AUDITS=$audit_bucket" >> "$GITHUB_ENV"
          echo "R2_PUBLIC_BASE_URL_AUDITS=$audit_public_base_url" >> "$GITHUB_ENV"
          {
            echo "RESOLVED_CALLBACK_TOKEN<<__AUDIT_TOKEN__"
            echo "$callback_token"
            echo "__AUDIT_TOKEN__"
          } >> "$GITHUB_ENV"

      - name: Run Digital Growth audit
        shell: bash
        run: |
          mkdir -p artifacts/digital-growth
          set +e
          python scripts/audits/digital_growth_audit.py \
            --base-url "$INPUT_BASE_URL" \
            --session-id "$INPUT_SESSION_ID" \
            --report-prefix "$INPUT_REPORT_PREFIX" \
            --exclude-prefixes "$INPUT_EXCLUDE_PREFIXES" \
            --callback-url "$RESOLVED_CALLBACK_URL" \
            --callback-token "$RESOLVED_CALLBACK_TOKEN" \
            --analysis-url "$INPUT_ANALYSIS_URL" \
            --audit-bucket "$R2_BUCKET_AUDITS" \
            --audit-public-base-url "$R2_PUBLIC_BASE_URL_AUDITS" \
            2>&1 | tee artifacts/digital-growth/workflow.log
          audit_status=${PIPESTATUS[0]}
          set -e
          echo "AUDIT_EXIT_CODE=$audit_status" >> "$GITHUB_ENV"
          exit "$audit_status"

      - name: Notify AIMS if workflow failed before stage callback
        if: failure() && env.RESOLVED_CALLBACK_URL != ''
        shell: bash
        run: |
          marker="artifacts/digital-growth/.digital-growth-callback-posted.json"
          if [ -f "$marker" ]; then
            echo "Digital Growth audit already posted a structured callback; suppressing generic fallback callback."
            cat "$marker"
            exit 0
          fi

          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          callback_url = os.environ.get("RESOLVED_CALLBACK_URL", "").strip()
          token = os.environ.get("RESOLVED_CALLBACK_TOKEN", "").strip()
          if not callback_url:
            raise SystemExit(0)
          log_path = Path("artifacts/digital-growth/workflow.log")
          workflow_log_tail = ""
          if log_path.exists():
            workflow_log_tail = "\n".join(log_path.read_text(encoding="utf-8", errors="replace").splitlines()[-120:])[-20000:]
          exit_code = os.environ.get("AUDIT_EXIT_CODE", "unknown")
          payload = {
            "auditType": "digital-growth",
            "sessionId": os.environ["INPUT_SESSION_ID"],
            "status": "failed",
            "reportPrefix": os.environ["INPUT_REPORT_PREFIX"],
            "message": "Digital Growth GitHub workflow failed before a structured stage callback was posted.",
            "error": (workflow_log_tail.splitlines()[-1] if workflow_log_tail else "GitHub Actions failure before Digital Growth stage publication completed")[:4000],
            "failedStep": "Run Digital Growth audit",
            "exitCode": exit_code,
            "workflowLogTail": workflow_log_tail,
            "workflowRunUrl": os.environ.get("WORKFLOW_RUN_URL", ""),
          }
          headers = {"Content-Type":"application/json", "Authorization":f"Bearer {token}", "X-Audit-Callback-Token":token}
          request = urllib.request.Request(callback_url, data=json.dumps(payload).encode(), headers=headers, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
            print(f"Fallback callback posted: HTTP {response.status}")
          PY

      - name: Upload Digital Growth audit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digital-growth-${{ inputs.session_id }}
          path: artifacts/digital-growth
          if-no-files-found: warn
          retention-days: 14

      - name: Clean local temporary Digital Growth files
        if: always()
        shell: bash
        run: rm -rf artifacts/digital-growth
