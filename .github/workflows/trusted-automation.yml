name: Trusted automation admission for Mergify

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Production readiness", "CodeQL", "Security and repository quality", "Branch PR signal"]
    types: [requested, completed]
  # Safety-net reconciliation only around the weekend window (UTC covers both BST and GMT),
  # plus one daily sweep. Event triggers above handle everything else.
  schedule:
    - cron: "17,47 22-23 * * 6"
    - cron: "17,47 0-5 * * 0"
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  security-events: read

concurrency:
  group: trusted-automation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      ${{
        (github.event_name != 'issue_comment' ||
         (github.event.issue.pull_request &&
          (github.event.comment.user.type != 'Bot' ||
           github.event.comment.user.login == (vars.KILO_REPAIR_PR_LOGIN || 'kilo-code-bot[bot]')))) &&
        (github.event_name != 'workflow_run' || github.event.action != 'requested' ||
         github.event.workflow_run.event == 'pull_request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mint autonomous repair GitHub App token
        id: app_token
        env:
          APP_ID: ${{ vars.AUTONOMY_REPAIR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTONOMY_REPAIR_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APP_ID:-}" || { echo "::error::Repository variable AUTONOMY_REPAIR_APP_ID is required."; exit 1; }
          test -n "${APP_PRIVATE_KEY:-}" || { echo "::error::Repository secret AUTONOMY_REPAIR_APP_PRIVATE_KEY is required."; exit 1; }

          key_file="${RUNNER_TEMP}/autonomy-repair-app.pem"
          printf '%s\n' "$APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_ID" | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          jwt="${unsigned}.${signature}"

          installation="$(
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${jwt}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/installation"
          )"
          installation_id="$(jq -er '.id' <<< "$installation")"
          repair_app_slug="$(jq -er '.app_slug' <<< "$installation")"

          app_token="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${jwt}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/app/installations/${installation_id}/access_tokens" |
              jq -er '.token'
          )"

          rm -f "$key_file"
          echo "::add-mask::${app_token}"
          printf 'token=%s\n' "$app_token" >> "$GITHUB_OUTPUT"
          printf 'repair_app_login=%s[bot]\n' "$repair_app_slug" >> "$GITHUB_OUTPUT"

      - name: Check out trusted default-branch automation only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create or reuse pull request for approved branch signal
        if: >-
          ${{ github.event_name == 'workflow_run' &&
              github.event.action == 'completed' &&
              github.event.workflow_run.name == 'Branch PR signal' &&
              github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          MANAGED_LABEL: automation:branch-pr
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "$REPO" || exit 0
          case "$SOURCE_BRANCH" in
            fix/*|feat/*|chore/*|ci/*|work/*|codex/*) ;;
            *) echo "Branch is outside approved namespaces: $SOURCE_BRANCH"; exit 0 ;;
          esac
          case "$SOURCE_BRANCH" in
            autonomy/*|renovate/*|dependabot/*|mergify/*|tmp/*|temp/*|internal/*) exit 0 ;;
          esac
          current_sha="$(gh api "repos/${REPO}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha')"
          test "$current_sha" = "$SOURCE_SHA" || { echo "Branch moved; newer signal will reconcile it."; exit 0; }
          ahead="$(gh api "repos/${REPO}/compare/${DEFAULT_BRANCH}...${SOURCE_BRANCH}" --jq '.ahead_by')"
          test "$ahead" -gt 0 || exit 0

          existing="$(gh pr list --repo "$REPO" --state open --base "$DEFAULT_BRANCH" --head "$SOURCE_BRANCH" --limit 100 --json number --jq '.[0].number // empty')"
          if test -n "$existing"; then
            echo "Using existing PR #${existing}."
            exit 0
          fi

          gh label create "$MANAGED_LABEL" --repo "$REPO" --color 1D76DB --description "PR created and managed by trusted branch automation" --force >/dev/null
          message="$(gh api "repos/${REPO}/commits/${SOURCE_SHA}" --jq '.commit.message')"
          title="$(printf '%s\n' "$message" | head -n 1 | cut -c1-240)"
          test -n "$title" || title="${SOURCE_BRANCH%%/*}: ${SOURCE_BRANCH#*/}"
          body="$(cat <<EOF
          Created automatically by the repository's trusted branch automation.

          - Source branch: \`${SOURCE_BRANCH}\`
          - Target branch: \`${DEFAULT_BRANCH}\`
          - Signalled head: \`${SOURCE_SHA}\`

          The repository's normal pull-request CI and security workflows must complete successfully before native GitHub auto-merge is requested.
          EOF
          )"
          url="$(gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$SOURCE_BRANCH" --title "$title" --body "$body")"
          number="${url##*/}"
          gh pr edit "$number" --repo "$REPO" --add-label "$MANAGED_LABEL"
          echo "Created managed PR #${number}."

      - name: Reconcile managed branch pull requests
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPAIR_APP_LOGIN: ${{ steps.app_token.outputs.repair_app_login }}
          MANAGED_LABEL: automation:branch-pr
          REQUIRED_WORKFLOWS: "Production readiness|CodeQL|Security and repository quality"
        shell: bash
        run: |
          set -euo pipefail
          gh label create "$MANAGED_LABEL" --repo "$REPO" --color 1D76DB --description "PR created and managed by trusted branch automation" --force >/dev/null
          while IFS=$'\t' read -r number branch sha; do
            test -n "$number" || continue
            case "$branch" in fix/*|feat/*|chore/*|ci/*|work/*|codex/*) ;; *) continue ;; esac

            pr="$(gh api "repos/${REPO}/pulls/${number}")"
            if jq -e '[.labels[].name | ascii_downcase] | any(. == "autonomy:human-hold" or . == "do-not-merge" or . == "do not merge" or . == "hold")' <<< "$pr" >/dev/null; then
              echo "PR #${number} has a hold label; withholding auto-merge."
              continue
            fi
            merge_state="$(jq -r '.mergeable_state // "unknown"' <<< "$pr")"
            if test "$merge_state" = "dirty"; then
              echo "PR #${number} has merge conflicts; withholding auto-merge."
              continue
            fi
            if test "$merge_state" = "behind"; then
              gh api --method PUT "repos/${REPO}/pulls/${number}/update-branch" -f expected_head_sha="$sha" >/dev/null || true
              echo "PR #${number} was behind; requested a branch update and fresh CI."
              continue
            fi

            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&event=pull_request&per_page=100")"
            ready=true
            IFS='|' read -ra names <<< "$REQUIRED_WORKFLOWS"
            for workflow in "${names[@]}"; do
              state="$(jq -r --arg name "$workflow" '[.workflow_runs[] | select(.name == $name)] | sort_by(.id) | last | if . == null then "missing" else "\(.status)/\(.conclusion)" end' <<< "$runs")"
              if test "$state" != "completed/success"; then
                echo "PR #${number} not ready: ${workflow} is ${state}."
                ready=false
                break
              fi
            done
            test "$ready" = true || continue

            current="$(gh api "repos/${REPO}/pulls/${number}")"
            current_sha="$(jq -r '.head.sha' <<< "$current")"
            test "$current_sha" = "$sha" || { echo "PR #${number} head changed; deferring."; continue; }
            current_base="$(jq -r '.base.sha' <<< "$current")"
            live_base="$(gh api "repos/${REPO}/branches/${DEFAULT_BRANCH}" --jq '.commit.sha')"
            test "$current_base" = "$live_base" || { echo "PR #${number} base moved; deferring."; continue; }

            gh pr merge "$number" --repo "$REPO" --auto --squash
            echo "Requested native GitHub auto-merge for PR #${number}."
          done < <(
            gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" |
              jq -r --arg app "$REPAIR_APP_LOGIN" --arg repo "$REPO" --arg base "$DEFAULT_BRANCH" --arg label "$MANAGED_LABEL" '
                .[] |
                select(.draft == false) |
                select(.user.login == $app) |
                select(.head.repo.full_name == $repo and .base.ref == $base) |
                select(any(.labels[]?; .name == $label)) |
                [.number, .head.ref, .head.sha] | @tsv
              '
          )

      - name: Admit, repair and reconcile verified automation pull requests
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPAIR_APP_LOGIN: ${{ steps.app_token.outputs.repair_app_login }}
          KILO_REPAIR_PR_LOGIN: ${{ vars.KILO_REPAIR_PR_LOGIN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REQUIRED_WORKFLOWS: "Production readiness|CodeQL|Security and repository quality"
        run: python .github/scripts/trusted_automation.py
