name: DAST penetration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

env:
  DAST_ENABLED: ${{ vars.DAST_ENABLED || 'false' }}
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || '' }}

jobs:
  zap-full-scan:
    name: OWASP ZAP full active scan
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
    steps:
      - name: Refuse unauthorised/non-HTTPS remote target
        shell: bash
        run: |
          set -euo pipefail
          case "$DAST_TARGET_URL" in https://*) ;; *) echo "::error::DAST_TARGET_URL must be an authorised HTTPS endpoint."; exit 1;; esac

      - name: Check out trusted evidence persistence helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run authorised ZAP full scan
        id: zap
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}

      - name: Persist DAST evidence to R2
        if: always()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input -r requirements-audit.txt
          python3 scripts/audits/persist_repository_evidence.py \
            --kind dast \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --status "${{ steps.zap.outcome }}" \
            --attach report_html.html \
            --attach report_json.json \
            --attach report_md.md
