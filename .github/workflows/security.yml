name: Security and repository quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify branch PR safety and idempotency
        run: python3 .github/scripts/test_branch_pr_automation.py
      - name: Verify autonomy lifecycle regressions
        run: python3 .github/scripts/test_autonomy_lifecycle.py
      - name: Verify PR blocker recovery regressions
        run: python3 .github/scripts/test_pr_blocker_recovery.py
      - name: Verify Kilo ownership-routing regressions
        run: python3 .github/scripts/test_kilo_failure_classifier.py
      - name: Verify durable writer-lease regressions
        run: PYTHONPATH=.github/scripts python3 .github/scripts/test_repair_lease.py
      - name: Repository secret policy scan
        run: python3 scripts/scan_secrets.py
      - name: Install pinned Gitleaks and actionlint
        env:
          GOBIN: ${{ runner.temp }}/ci-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Verify Gitleaks exact-fingerprint ignore contract
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-bin/gitleaks
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          git init -q
          git config user.name 'Website CI'
          git config user.email 'ci@example.invalid'

          canary_one="ghp_$(printf 'website-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_one" > ignored.txt
          git add ignored.txt
          git commit -qm 'synthetic ignored finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
          first_status=$?
          set -e
          test "$first_status" -eq 42 || {
            echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
            exit 1
          }

          fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
          printf '%s\n' "$fingerprint" > .gitleaksignore

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          ignored_status=$?
          set -e
          test "$ignored_status" -eq 0 || {
            echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
            exit 1
          }

          canary_two="ghp_$(printf 'website-gitleaks-ignore-contract-two' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_two" > unlisted.txt
          git add .gitleaksignore unlisted.txt
          git commit -qm 'synthetic unlisted finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          unlisted_status=$?
          set -e
          test "$unlisted_status" -eq 42 || {
            echo "::error::Unlisted synthetic finding did not fail Gitleaks (exit $unlisted_status)."
            exit 1
          }

      - name: Gitleaks history scan
        run: |
          "${{ runner.temp }}/ci-bin/gitleaks" git . --redact --no-banner
      - name: Prove actionlint rejects a seeded workflow defect
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/seeded-invalid-workflow.yml"
          printf '%s\n' 'name: seeded-invalid' 'on: [push]' 'jobs:' '  broken:' '    runs-on: [ubuntu-latest' > "$fixture"
          set +e
          "${{ runner.temp }}/ci-bin/actionlint" "$fixture"
          status=$?
          set -e
          test "$status" -ne 0 || {
            echo "::error::actionlint accepted the seeded invalid workflow."
            exit 1
          }
      - name: Validate GitHub Actions workflows
        run: |
          "${{ runner.temp }}/ci-bin/actionlint" -color
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location             "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"             --output "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${{ runner.temp }}/ci-bin/shellcheck"
      - name: Validate build.sh with ShellCheck
        run: |
          "${{ runner.temp }}/ci-bin/shellcheck" build.sh
      - name: Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
