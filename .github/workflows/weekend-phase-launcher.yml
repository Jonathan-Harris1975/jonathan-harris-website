name: Weekend CI phase launcher

on:
  schedule:
    - cron: "0 1 * * 6"
    - cron: "0 0 * * 6"
    - cron: "0 0 * * 0"
    - cron: "0 23 * * 0"
    - cron: "30 23 * * 0"
    - cron: "30 22 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to dispatch"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - dast
          - council

permissions:
  actions: write
  contents: read

concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Europe/London phase slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase || '' }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(TZ=Europe/London date '+%a %H:%M')"
          phase=""; workflow=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
            case "$phase" in
              ci) workflow="production-readiness.yml" ;;
              dast) workflow="dast.yml" ;;
              council) workflow="council.yml" ;;
              *) echo "::error::Unsupported phase $phase"; exit 1 ;;
            esac
          else
          if [ "$now" = "Sat 01:00" ]; then phase="ci"; workflow="production-readiness.yml"; fi
          if [ "$now" = "Sun 00:00" ]; then phase="dast"; workflow="dast.yml"; fi
          if [ "$now" = "Sun 23:30" ]; then phase="council"; workflow="council.yml"; fi
          fi
          if [ -z "$phase" ]; then
            echo "Scheduled UTC/DST duplicate is outside the intended London slot; no action."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "run=true"
            echo "phase=$phase"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch phase workflow
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.slot.outputs.workflow }}
        run: gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

      - name: Record allocated windows
        if: always()
        run: |
          echo "CI: Sat 01:00–Sat 03:30"
          echo "DAST: Sun 00:00–Sun 02:00"
          echo "Council: Sun 23:30–Mon 02:00"
          echo "Weekend operating envelope: Friday 20:00 to Monday 04:00 Europe/London"
