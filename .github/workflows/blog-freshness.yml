name: Blog freshness monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-blog-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh the public RSS snapshot with cache bypass
        run: node scripts/generate-blog-from-rss.mjs
      - name: Enforce the eight-day editorial freshness SLA
        run: python3 scripts/check_blog_freshness.py --max-age-days 8
