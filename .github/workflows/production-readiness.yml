name: Production readiness

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install and validate Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip check
      - name: Audit production Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
      - run: python scripts/check_health_contract.py
      - run: bash build.sh
      - name: Scan committed source for secrets
        run: python scripts/scan_secrets.py

  release_gate:
    name: Release gate (exact SHA)
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$RESULT_VALIDATE" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

