name: Production readiness

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install and validate Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip check
      - name: Audit production Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
      - run: python scripts/check_health_contract.py
      - run: bash build.sh
      - name: Scan committed source for secrets
        run: python scripts/scan_secrets.py

  release_gate:
    name: Release gate (exact SHA)
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$RESULT_VALIDATE" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

  ci_gate:
    name: ci-gate
    needs: [release_gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require exact-SHA release gate
        env:
          RELEASE_GATE_RESULT: ${{ needs.release_gate.result }}
        run: test "$RELEASE_GATE_RESULT" = success

  council_freeze:
    name: Record final CI evidence freeze
    needs: [ci_gate]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.ci_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    concurrency:
      group: council-window-${{ github.repository }}-default
      cancel-in-progress: false
    steps:
      - name: Check out protected freeze controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Freeze ordinary merges before final CI PASS
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE_MODE: record
          KILO_REPAIR_PR_LOGIN: ${{ vars.KILO_REPAIR_PR_LOGIN }}
          DAST_ENABLED: ${{ vars.DAST_ENABLED }}
        run: python3 .github/scripts/merge_window.py
      - name: Retain authenticated CI freeze marker
        if: steps.freeze.outputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.freeze.outputs.artifact }}
          path: council-freeze.json
          if-no-files-found: error
          retention-days: 90

