name: Lychee link integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-lychee-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link_integrity:
    name: Lychee link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository links with pinned Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --cache
            --root-dir .
            --max-retries 2
            --timeout 20
            --exclude '^file://.*/ebooks/[^/]+/buy-now            './**/*.md'
            './**/*.html'

            --exclude '^https://mybook\.to/'
            --exclude '^https://www\.ofcom\.org\.uk/online-safety/illegal-and-harmful-content/'
            './**/*.md'
            './**/*.html'
