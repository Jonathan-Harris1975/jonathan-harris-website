name: Mobile UX hard-gate audit
run-name: Mobile UX - ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Audit session id
        required: true
        type: string
      report_prefix:
        description: R2 prefix under the dedicated audits bucket
        required: true
        type: string
      base_url:
        description: Live base URL
        required: true
        default: https://jonathan-harris.online
        type: string
      exclude_prefixes:
        description: Comma-separated route prefixes to exclude
        required: false
        default: /podcast,/blog
        type: string
      callback_url:
        description: AI Management Suite mobile UX callback URL
        required: false
        default: ""
        type: string
      analysis_url:
        description: Compatibility input from shared audit dispatcher; ignored by deterministic mobile UX report generation
        required: false
        default: ""
        type: string
      callback_token:
        description: AI Management Suite callback token supplied by Koyeb dispatch
        required: false
        default: ""
        type: string
      audit_bucket:
        description: Dedicated audits R2 bucket name
        required: false
        default: ""
        type: string
      audit_public_base_url:
        description: Dedicated audits R2 reference base (HTTPS or r2://bucket)
        required: false
        default: ""
        type: string
      audit_bucket_env:
        description: Compatibility input; expected value R2_BUCKET_AUDITS
        required: false
        default: R2_BUCKET_AUDITS
        type: string
      audit_public_base_env:
        description: Compatibility input; expected value R2_PUBLIC_BASE_URL_AUDITS
        required: false
        default: R2_PUBLIC_BASE_URL_AUDITS
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ux-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  mobile-ux:
    environment: R2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      AUDIT_CALLBACK_TOKEN: ${{ secrets.AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_TOKEN: ${{ secrets.AI_SUITE_AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_URL: ${{ vars.AI_SUITE_AUDIT_CALLBACK_URL }}
      INPUT_SESSION_ID: ${{ inputs.session_id }}
      INPUT_REPORT_PREFIX: ${{ inputs.report_prefix }}
      INPUT_BASE_URL: ${{ inputs.base_url }}
      INPUT_EXCLUDE_PREFIXES: ${{ inputs.exclude_prefixes }}
      INPUT_CALLBACK_URL: ${{ inputs.callback_url }}
      INPUT_ANALYSIS_URL: ${{ inputs.analysis_url }}
      INPUT_CALLBACK_TOKEN: ${{ inputs.callback_token }}
      INPUT_AUDIT_BUCKET: ${{ inputs.audit_bucket }}
      INPUT_AUDIT_PUBLIC_BASE_URL: ${{ inputs.audit_public_base_url }}
      INPUT_AUDIT_BUCKET_ENV: ${{ inputs.audit_bucket_env }}
      INPUT_AUDIT_PUBLIC_BASE_ENV: ${{ inputs.audit_public_base_env }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate workflow-dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audits/validate_workflow_inputs.py --callback-suffix "/audits/mobile-ux/callback"

      - name: Resolve audit runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          callback_url="$INPUT_CALLBACK_URL"
          if [ -z "$callback_url" ]; then
            callback_url="$AI_SUITE_AUDIT_CALLBACK_URL"
          fi
          if [ -z "$callback_url" ]; then
            callback_url="https://zeroth-kara-jonathanharris-3296ed37.koyeb.app/audits/mobile-ux/callback"
          fi
          case "$callback_url" in
            */audits/mobile-ux/callback) ;;
            *)
              echo "::error::callback_url must end with /audits/mobile-ux/callback; got $callback_url"
              exit 1
              ;;
          esac

          callback_token="$INPUT_CALLBACK_TOKEN"
          if [ -z "$callback_token" ]; then
            callback_token="$AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            callback_token="$AI_SUITE_AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            echo "::error::AUDIT callback token was not supplied. Dispatch callback_token from AIMS or configure AUDIT_CALLBACK_TOKEN/AI_SUITE_AUDIT_CALLBACK_TOKEN in the R2 environment."
            exit 1
          fi

          audit_bucket="$INPUT_AUDIT_BUCKET"
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ secrets.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ vars.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            echo "::error::R2_BUCKET_AUDITS was not supplied. Mobile UX artefacts must use the dedicated audits bucket."
            exit 1
          fi

          audit_public_base_url="$INPUT_AUDIT_PUBLIC_BASE_URL"
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ secrets.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ vars.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            # Audit artefacts are private by design; use an authenticated R2 reference.
            audit_public_base_url="r2://$audit_bucket"
          fi

          for required_name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::$required_name is not configured in the R2 environment."
              exit 1
            fi
          done

          if [ "$INPUT_AUDIT_BUCKET_ENV" != "R2_BUCKET_AUDITS" ]; then
            echo "::error::audit_bucket_env must be R2_BUCKET_AUDITS for mobile-ux outputs."
            exit 1
          fi
          if [ "$INPUT_AUDIT_PUBLIC_BASE_ENV" != "R2_PUBLIC_BASE_URL_AUDITS" ]; then
            echo "::error::audit_public_base_env must be R2_PUBLIC_BASE_URL_AUDITS for mobile-ux outputs."
            exit 1
          fi

          if [ -z "${R2_REGION:-}" ]; then
            echo "R2_REGION=auto" >> "$GITHUB_ENV"
          fi

          echo "::add-mask::$callback_token"
          echo "RESOLVED_CALLBACK_URL=$callback_url" >> "$GITHUB_ENV"
          echo "R2_BUCKET_AUDITS=$audit_bucket" >> "$GITHUB_ENV"
          echo "R2_PUBLIC_BASE_URL_AUDITS=${audit_public_base_url%/}" >> "$GITHUB_ENV"
          {
            echo "RESOLVED_CALLBACK_TOKEN<<__AUDIT_TOKEN__"
            echo "$callback_token"
            echo "__AUDIT_TOKEN__"
          } >> "$GITHUB_ENV"

      - name: Install core Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check boto3 requests playwright

      - name: Install Chromium for Playwright
        id: playwright_install
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Record Playwright install outcome
        if: always()
        shell: bash
        run: echo "PLAYWRIGHT_INSTALL_OUTCOME=${{ steps.playwright_install.outcome }}" >> "$GITHUB_ENV"

      - name: Validate mobile audit entry point, workbook and browser
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audits/common.py scripts/audits/mobile_ux_hard_gate.py
          python - <<'PY'
          from scripts.audits.common import find_workbook, load_workbook_info
          from playwright.sync_api import sync_playwright

          workbook = find_workbook()
          info = load_workbook_info(workbook)
          if info.primary_sheet != "Pages":
              raise SystemExit(f"Expected Pages worksheet, got {info.primary_sheet!r}")
          if info.url_count < 1:
              raise SystemExit("Website inventory workbook contains no usable routes")

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 390, "height": 844})
              page.set_content("<main>mobile-audit-browser-ready</main>")
              assert page.locator("main").inner_text() == "mobile-audit-browser-ready"
              browser.close()

          print(f"Validated {workbook.name}: routes={info.url_count}; Chromium launch succeeded")
          PY

      - name: Run rendered mobile UX audit
        id: audit
        timeout-minutes: 45
        env:
          MOBILE_UX_MAX_RUNTIME_SECONDS: "2400"
        shell: bash
        run: |
          mkdir -p artifacts/mobile-ux
          set +e
          python -u scripts/audits/mobile_ux_hard_gate.py \
            --base-url "$INPUT_BASE_URL" \
            --session-id "$INPUT_SESSION_ID" \
            --report-prefix "$INPUT_REPORT_PREFIX" \
            --exclude-prefixes "$INPUT_EXCLUDE_PREFIXES" \
            --callback-url "$RESOLVED_CALLBACK_URL" \
            --callback-token "$RESOLVED_CALLBACK_TOKEN" \
            --analysis-url "$INPUT_ANALYSIS_URL" \
            --audit-bucket "$R2_BUCKET_AUDITS" \
            --audit-public-base-url "$R2_PUBLIC_BASE_URL_AUDITS" \
            --max-runtime-seconds "$MOBILE_UX_MAX_RUNTIME_SECONDS" \
            --output-dir artifacts/mobile-ux \
            2>&1 | tee artifacts/mobile-ux/workflow.log
          audit_status=${PIPESTATUS[0]}
          set -e
          echo "AUDIT_EXIT_CODE=$audit_status" >> "$GITHUB_ENV"

          marker="artifacts/mobile-ux/.mobile-ux-callback-posted.json"
          if [ "$audit_status" -ne 0 ] && [ -f "$marker" ]; then
            echo "Mobile UX audit produced a structured callback marker:"
            cat "$marker"
            workflow_failure="$(python - <<'PY'
          import json
          from pathlib import Path
          marker = Path("artifacts/mobile-ux/.mobile-ux-callback-posted.json")
          try:
              print("true" if json.loads(marker.read_text(encoding="utf-8")).get("workflowFailure") else "false")
          except Exception:
              print("true")
          PY
          )"
            if [ "$workflow_failure" = "true" ]; then
              echo "Mobile UX audit reported an infrastructure/publication failure."
              exit "$audit_status"
            fi
            echo "Mobile UX audit posted a controlled non-scoring result; workflow transport completed."
            exit 0
          fi

          exit "$audit_status"

      - name: Notify AIMS if workflow failed before artefacts were published
        if: failure()
        shell: bash
        run: |
          if [ -f artifacts/mobile-ux/.mobile-ux-callback-posted.json ]; then
            echo "Mobile UX audit already posted a structured callback; suppressing generic fallback callback."
            cat artifacts/mobile-ux/.mobile-ux-callback-posted.json
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          callback_url = (
              os.environ.get("RESOLVED_CALLBACK_URL", "").strip()
              or os.environ.get("INPUT_CALLBACK_URL", "").strip()
              or os.environ.get("AI_SUITE_AUDIT_CALLBACK_URL", "").strip()
              or "https://zeroth-kara-jonathanharris-3296ed37.koyeb.app/audits/mobile-ux/callback"
          )
          token = (
              os.environ.get("RESOLVED_CALLBACK_TOKEN", "").strip()
              or os.environ.get("INPUT_CALLBACK_TOKEN", "").strip()
              or os.environ.get("AUDIT_CALLBACK_TOKEN", "").strip()
              or os.environ.get("AI_SUITE_AUDIT_CALLBACK_TOKEN", "").strip()
          )
          if not callback_url or not token:
              print("::warning::Unable to post fallback callback because URL or token is unavailable")
              raise SystemExit(0)

          log_path = Path("artifacts/mobile-ux/workflow.log")
          detail = log_path.read_text(encoding="utf-8", errors="replace")[-6000:] if log_path.exists() else ""
          detail = re.sub(r"Bearer\s+\S+", "Bearer [masked]", detail)
          detail = re.sub(r"(?:sk-or-|github_pat_)[A-Za-z0-9._-]+", "[masked-token]", detail)

          payload = {
              "auditType": "mobile-ux",
              "sessionId": os.environ["INPUT_SESSION_ID"],
              "status": "failed",
              "reportPrefix": os.environ["INPUT_REPORT_PREFIX"],
              "message": "Mobile UX GitHub workflow failed before a complete artefact set was published to R2.",
              "error": detail or "GitHub Actions failure before Mobile UX artefact publication completed",
              "storageUploadError": "The workflow did not publish the mandatory completion artefacts.",
              "blocked": True,
              "hardGateBlocked": False,
              "workflowFailure": True,
              "auditExitCode": os.environ.get("AUDIT_EXIT_CODE"),
              "playwrightInstallOutcome": os.environ.get("PLAYWRIGHT_INSTALL_OUTCOME"),
              "blockedTests": [{
                  "stage": "GitHub Actions workflow",
                  "blocker": "workflow failure before complete Mobile UX artefact publication",
                  "reason": "The workflow log and local artefacts are retained for diagnosis."
              }],
              "workflowRunUrl": os.environ.get("WORKFLOW_RUN_URL", ""),
          }
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {token}",
              "X-Audit-Callback-Token": token,
          }
          request = urllib.request.Request(callback_url, data=json.dumps(payload).encode(), headers=headers, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Fallback callback posted: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              print(f"::warning::Fallback callback returned HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')[:1000]}")
          except Exception as exc:
              print(f"::warning::Fallback callback failed: {exc}")
          PY

      - name: Upload Mobile UX diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ux-${{ inputs.session_id }}
          path: artifacts/mobile-ux
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Clean local temporary Mobile UX audit files
        if: always()
        shell: bash
        run: rm -rf artifacts/mobile-ux
