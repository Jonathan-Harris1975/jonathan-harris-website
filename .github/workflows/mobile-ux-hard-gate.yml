name: Mobile UX hard-gate audit
run-name: Mobile UX - ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Audit session id
        required: true
        type: string
      report_prefix:
        description: R2 prefix under the dedicated audits bucket
        required: true
        type: string
      base_url:
        description: Live base URL
        required: true
        default: https://jonathan-harris.online
        type: string
      exclude_prefixes:
        description: Comma-separated route prefixes to exclude
        required: false
        default: /podcast,/blog
        type: string
      callback_url:
        description: AI Management Suite mobile UX callback URL
        required: false
        default: ""
        type: string
      analysis_url:
        description: Compatibility input from shared audit dispatcher; ignored by deterministic mobile UX report generation
        required: false
        default: ""
        type: string
      callback_token:
        description: AI Management Suite callback token supplied by Koyeb dispatch
        required: false
        default: ""
        type: string
      audit_bucket:
        description: Dedicated audits R2 bucket name
        required: false
        default: ""
        type: string
      audit_public_base_url:
        description: Dedicated audits R2 public base URL
        required: false
        default: ""
        type: string
      audit_bucket_env:
        description: Compatibility input; expected value R2_BUCKET_AUDITS
        required: false
        default: R2_BUCKET_AUDITS
        type: string
      audit_public_base_env:
        description: Compatibility input; expected value R2_PUBLIC_BASE_URL_AUDITS
        required: false
        default: R2_PUBLIC_BASE_URL_AUDITS
        type: string

permissions:
  contents: read

jobs:
  mobile-ux:
    environment: R2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      AUDIT_CALLBACK_TOKEN: ${{ secrets.AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_TOKEN: ${{ secrets.AI_SUITE_AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_URL: ${{ vars.AI_SUITE_AUDIT_CALLBACK_URL }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve audit runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          callback_url="${{ inputs.callback_url }}"
          if [ -z "$callback_url" ]; then
            callback_url="$AI_SUITE_AUDIT_CALLBACK_URL"
          fi
          if [ -z "$callback_url" ]; then
            callback_url="https://app.jonathan-harris.online/audits/mobile-ux/callback"
          fi
          case "$callback_url" in
            */audits/mobile-ux/callback) ;;
            *)
              echo "::error::callback_url must end with /audits/mobile-ux/callback; got $callback_url"
              exit 1
              ;;
          esac

          callback_token="${{ inputs.callback_token }}"
          if [ -z "$callback_token" ]; then
            callback_token="$AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            callback_token="$AI_SUITE_AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            echo "::error::AUDIT callback token was not supplied. The AI Management Suite should dispatch callback_token from Koyeb, or the R2 environment must define AUDIT_CALLBACK_TOKEN/AI_SUITE_AUDIT_CALLBACK_TOKEN for manual runs."
            exit 1
          fi

          audit_bucket="${{ inputs.audit_bucket }}"
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ secrets.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ vars.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            echo "::error::R2_BUCKET_AUDITS was not supplied. Mobile UX audit artefacts must use the dedicated audits bucket."
            exit 1
          fi

          audit_public_base_url="${{ inputs.audit_public_base_url }}"
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ secrets.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ vars.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            echo "::error::R2_PUBLIC_BASE_URL_AUDITS was not supplied. Mobile UX audit artefacts must resolve from the dedicated audits public base URL."
            exit 1
          fi

          if [ "${{ inputs.audit_bucket_env }}" != "R2_BUCKET_AUDITS" ]; then
            echo "::error::audit_bucket_env must be R2_BUCKET_AUDITS for mobile-ux outputs."
            exit 1
          fi
          if [ "${{ inputs.audit_public_base_env }}" != "R2_PUBLIC_BASE_URL_AUDITS" ]; then
            echo "::error::audit_public_base_env must be R2_PUBLIC_BASE_URL_AUDITS for mobile-ux outputs."
            exit 1
          fi

          echo "::add-mask::$callback_token"
          echo "RESOLVED_CALLBACK_URL=$callback_url" >> "$GITHUB_ENV"
          echo "R2_BUCKET_AUDITS=$audit_bucket" >> "$GITHUB_ENV"
          echo "R2_PUBLIC_BASE_URL_AUDITS=$audit_public_base_url" >> "$GITHUB_ENV"
          {
            echo "RESOLVED_CALLBACK_TOKEN<<__AUDIT_TOKEN__"
            echo "$callback_token"
            echo "__AUDIT_TOKEN__"
          } >> "$GITHUB_ENV"

      - name: Install core Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check boto3 requests beautifulsoup4 openpyxl

      - name: Install Playwright package and Chromium
        id: playwright_install
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Record Playwright install outcome
        if: always()
        run: echo "PLAYWRIGHT_INSTALL_OUTCOME=${{ steps.playwright_install.outcome }}" >> "$GITHUB_ENV"

      - name: Run rendered mobile UX audit
        timeout-minutes: 45
        env:
          MOBILE_UX_MAX_RUNTIME_SECONDS: "2400"
        run: |
          python scripts/audits/mobile_ux_hard_gate.py \
            --base-url "${{ inputs.base_url }}" \
            --session-id "${{ inputs.session_id }}" \
            --report-prefix "${{ inputs.report_prefix }}" \
            --exclude-prefixes "${{ inputs.exclude_prefixes }}" \
            --callback-url "$RESOLVED_CALLBACK_URL" \
            --callback-token "$RESOLVED_CALLBACK_TOKEN" \
            --analysis-url "${{ inputs.analysis_url }}" \
            --audit-bucket "$R2_BUCKET_AUDITS" \
            --audit-public-base-url "$R2_PUBLIC_BASE_URL_AUDITS"

      - name: Notify AI Suite if workflow failed before artefacts were published
        if: failure() && env.RESOLVED_CALLBACK_URL != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          callback_url = os.environ.get("RESOLVED_CALLBACK_URL", "").strip()
          token = os.environ.get("RESOLVED_CALLBACK_TOKEN", "").strip()
          if not callback_url:
            raise SystemExit(0)

          payload = {
            "auditType": "mobile-ux",
            "sessionId": "${{ inputs.session_id }}",
            "status": "failed",
            "reportPrefix": "${{ inputs.report_prefix }}",
            "message": "Mobile UX GitHub workflow failed before a complete artefact set was published to R2.",
            "error": "GitHub Actions job failure before Mobile UX artefact publication completed",
            "storageUploadError": "Only request.json may exist because the website workflow did not publish completion artefacts.",
            "blocked": True,
            "hardGateBlocked": False,
            "blockedTests": [
              {
                "stage": "GitHub Actions workflow",
                "blocker": "workflow failure before complete Mobile UX artefact publication",
                "reason": "AI Management Suite must publish a controlled failure artefact instead of leaving only request.json."
              }
            ],
            "workflowRunUrl": os.environ.get("WORKFLOW_RUN_URL", ""),
          }
          data = json.dumps(payload).encode("utf-8")
          headers = {"Content-Type": "application/json"}
          if token:
            headers["Authorization"] = f"Bearer {token}"
            headers["X-Audit-Callback-Token"] = token
          request = urllib.request.Request(callback_url, data=data, headers=headers, method="POST")
          try:
            with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Fallback callback posted: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
            print(f"::warning::Fallback callback failed with HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')[:1000]}")
          except Exception as exc:
            print(f"::warning::Fallback callback failed: {exc}")
          PY
