name: Website deployed integration

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] exact-main successful same-repository release gate
    workflows: ["Production readiness"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA to require
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: website-deployed-integration
  cancel-in-progress: false

jobs:
  integration:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate expected deployed commit SHA
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected deployment SHA must be a lowercase 40-character Git commit SHA.' >&2
            exit 1
          fi

      - name: Wait for exact Cloudflare Pages release
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          WEBSITE_ORIGIN: ${{ vars.WEBSITE_BASE_URL || 'https://jonathan-harris.online' }}
        run: |
          set -euo pipefail
          python3 scripts/wait_for_live_release.py --marker-only --require-release-sha \
            --expected-sha "$EXPECTED_DEPLOYMENT_SHA" --release-url "${WEBSITE_ORIGIN%/}/release.json" \
            --timeout-seconds 600 --interval-seconds 10 --request-timeout 15

      - name: Verify Pages R2 runtime health and exact revision
        env:
          WEBSITE_ORIGIN: ${{ vars.WEBSITE_BASE_URL || 'https://jonathan-harris.online' }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 "${WEBSITE_ORIGIN%/}/health.json")"
          printf '%s' "$body" | jq -e --arg sha "$EXPECTED_DEPLOYMENT_SHA" '
            .ok == true and .status == "healthy" and .service == "WEBSITE" and
            .revision == $sha and
            ([.bindings.TRANSCRIPTS_BUCKET, .bindings.BLOG_BUCKET] |
              all(.[]; .required == true and .configured == true and .runtime_access == "available")) and
            .bindings.BLOG_IMAGES_BUCKET.required == false and
            .bindings.COGNIPAL_RATE_LIMITER.required == true and
            .bindings.COGNIPAL_RATE_LIMITER.configured == true and
            .bindings.COGNIPAL_RATE_LIMITER.runtime_access == "available" and
            .bindings.COGNIPAL_RATE_LIMITER.source_commit_sha == $sha
          ' >/dev/null

      - name: Resolve expected Agent Readiness Worker source revision
        id: agent_readiness_revision
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          worker_sha="$(git log -1 --format=%H "$EXPECTED_DEPLOYMENT_SHA" -- workers/agent-readiness/index.js workers/agent-readiness/wrangler.toml)"
          if [[ ! "$worker_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the exact Agent Readiness Worker source revision." >&2
            exit 1
          fi
          echo "sha=$worker_sha" >> "$GITHUB_OUTPUT"

      - name: Verify Agent Readiness service binding and exact Worker source
        env:
          WEBSITE_ORIGIN: ${{ vars.WEBSITE_BASE_URL || 'https://jonathan-harris.online' }}
          EXPECTED_AGENT_READINESS_SHA: ${{ steps.agent_readiness_revision.outputs.sha }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error --max-time 20 \
            --dump-header "$headers" \
            --output "$body" \
            "${WEBSITE_ORIGIN%/}/.well-known/agent-readiness/status"
          jq -e --arg sha "$EXPECTED_AGENT_READINESS_SHA" '.ok == true and .service == "agent-readiness" and .source_sha == $sha' "$body" >/dev/null
          grep -Eiq '^x-agent-readiness-worker:[[:space:]]*agent-readiness[[:space:]]*$' "$headers"
          grep -Eiq '^x-agent-readiness-gateway:[[:space:]]*cloudflare-pages-service-binding[[:space:]]*$' "$headers"
          grep -Eiq '^x-agent-readiness-gateway-mode:[[:space:]]*service-binding[[:space:]]*$' "$headers"

      - name: Record exact-SHA deployment attestation
        env:
          DEPLOYED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          AGENT_READINESS_SOURCE_SHA: ${{ steps.agent_readiness_revision.outputs.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","agent_readiness_source_sha":"%s","workflow_run":"%s","service":"jonathan-harris-website","status":"pages-and-agent-readiness-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$AGENT_READINESS_SOURCE_SHA" "$GITHUB_RUN_ID" > deployment-attestation.json

      - name: Retain production deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-deployment-attestation-${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          path: deployment-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record ecosystem verification boundary
        run: |
          echo "::notice::HIVE independently validates fresh exact-SHA GitHub OIDC smoke-test and health evidence; the smoke test proves no provider trust."
          echo "::notice::Legacy MAST ecosystem smoke dispatch is retired."
