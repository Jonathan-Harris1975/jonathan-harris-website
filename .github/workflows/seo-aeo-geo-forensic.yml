name: SEO AEO GEO forensic audit
run-name: SEO AEO GEO - ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Audit session id
        required: true
        type: string
      report_prefix:
        description: R2 prefix under the dedicated audits bucket
        required: true
        type: string
      base_url:
        description: Live base URL
        required: true
        default: https://jonathan-harris.online
        type: string
      exclude_prefixes:
        description: Comma-separated route prefixes to exclude
        required: false
        default: ""
        type: string
      callback_url:
        description: AI Management Suite callback URL
        required: false
        default: https://app.jonathan-harris.online/audits/seo-aeo-geo/callback
        type: string
      analysis_url:
        description: Optional AI Management Suite analysis URL override
        required: false
        default: ""
        type: string
      callback_token:
        description: AI Management Suite callback token supplied by Koyeb dispatch
        required: false
        default: ""
        type: string
      audit_bucket:
        description: Dedicated audits R2 bucket name
        required: false
        default: ""
        type: string
      audit_public_base_url:
        description: Dedicated audits R2 public base URL
        required: false
        default: ""
        type: string
      audit_bucket_env:
        description: Compatibility input; expected value R2_BUCKET_AUDITS
        required: false
        default: R2_BUCKET_AUDITS
        type: string
      audit_public_base_env:
        description: Compatibility input; expected value R2_PUBLIC_BASE_URL_AUDITS
        required: false
        default: R2_PUBLIC_BASE_URL_AUDITS
        type: string

permissions:
  contents: read

concurrency:
  group: seo-aeo-geo-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  seo-aeo-geo:
    environment: R2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      AUDIT_CALLBACK_TOKEN: ${{ secrets.AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_TOKEN: ${{ secrets.AI_SUITE_AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_URL: ${{ vars.AI_SUITE_AUDIT_CALLBACK_URL }}
      INPUT_CALLBACK_URL: ${{ inputs.callback_url }}
      INPUT_CALLBACK_TOKEN: ${{ inputs.callback_token }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve AI-suite callback and audits bucket configuration
        shell: bash
        run: |
          set -euo pipefail

          callback_url="$INPUT_CALLBACK_URL"
          if [ -z "$callback_url" ]; then
            callback_url="$AI_SUITE_AUDIT_CALLBACK_URL"
          fi
          if [ -z "$callback_url" ]; then
            callback_url="https://app.jonathan-harris.online/audits/seo-aeo-geo/callback"
          fi
          case "$callback_url" in
            */audits/seo-aeo-geo/callback) ;;
            *)
              echo "::error::callback_url must end with /audits/seo-aeo-geo/callback; got $callback_url"
              exit 1
              ;;
          esac

          callback_token="$INPUT_CALLBACK_TOKEN"
          if [ -z "$callback_token" ]; then
            callback_token="$AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            callback_token="$AI_SUITE_AUDIT_CALLBACK_TOKEN"
          fi
          if [ -z "$callback_token" ]; then
            echo "::error::AUDIT callback token was not supplied. Dispatch callback_token from AIMS or configure AUDIT_CALLBACK_TOKEN/AI_SUITE_AUDIT_CALLBACK_TOKEN in the R2 environment."
            exit 1
          fi

          audit_bucket="${{ inputs.audit_bucket }}"
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ secrets.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            audit_bucket="${{ vars.R2_BUCKET_AUDITS }}"
          fi
          if [ -z "$audit_bucket" ]; then
            echo "::error::R2_BUCKET_AUDITS was not supplied. SEO/AEO/GEO artefacts must use the dedicated audits bucket."
            exit 1
          fi

          audit_public_base_url="${{ inputs.audit_public_base_url }}"
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ secrets.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            audit_public_base_url="${{ vars.R2_PUBLIC_BASE_URL_AUDITS }}"
          fi
          if [ -z "$audit_public_base_url" ]; then
            echo "::error::R2_PUBLIC_BASE_URL_AUDITS was not supplied."
            exit 1
          fi

          for required_name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::$required_name is not configured in the R2 environment."
              exit 1
            fi
          done

          if [ "${{ inputs.audit_bucket_env }}" != "R2_BUCKET_AUDITS" ]; then
            echo "::error::audit_bucket_env must be R2_BUCKET_AUDITS for SEO/AEO/GEO outputs."
            exit 1
          fi
          if [ "${{ inputs.audit_public_base_env }}" != "R2_PUBLIC_BASE_URL_AUDITS" ]; then
            echo "::error::audit_public_base_env must be R2_PUBLIC_BASE_URL_AUDITS for SEO/AEO/GEO outputs."
            exit 1
          fi

          if [ -z "${R2_REGION:-}" ]; then
            echo "R2_REGION=auto" >> "$GITHUB_ENV"
          fi

          echo "::add-mask::$callback_token"
          echo "RESOLVED_CALLBACK_URL=$callback_url" >> "$GITHUB_ENV"
          echo "R2_BUCKET_AUDITS=$audit_bucket" >> "$GITHUB_ENV"
          echo "R2_PUBLIC_BASE_URL_AUDITS=${audit_public_base_url%/}" >> "$GITHUB_ENV"
          {
            echo "RESOLVED_CALLBACK_TOKEN<<__AUDIT_TOKEN__"
            echo "$callback_token"
            echo "__AUDIT_TOKEN__"
          } >> "$GITHUB_ENV"

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check boto3 requests

      - name: Validate audit entry point and workbook inventory
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audits/common.py scripts/audits/seo_aeo_geo_forensic.py
          python - <<'PY'
          from scripts.audits.common import find_workbook, load_workbook_info

          workbook = find_workbook()
          info = load_workbook_info(workbook)
          if info.primary_sheet != "Pages":
              raise SystemExit(f"Expected Pages worksheet, got {info.primary_sheet!r}")
          if info.url_count < 1:
              raise SystemExit("Website inventory workbook contains no usable routes")
          print(f"Validated {workbook.name}: sheet={info.primary_sheet} routes={info.url_count}")
          PY

      - name: Run forensic SEO AEO GEO audit
        id: audit
        timeout-minutes: 60
        shell: bash
        run: |
          mkdir -p artifacts/seo-aeo-geo
          set +e
          python -u scripts/audits/seo_aeo_geo_forensic.py \
            --base-url "${{ inputs.base_url }}" \
            --session-id "${{ inputs.session_id }}" \
            --report-prefix "${{ inputs.report_prefix }}" \
            --exclude-prefixes "${{ inputs.exclude_prefixes }}" \
            --callback-url "$RESOLVED_CALLBACK_URL" \
            --callback-token "$RESOLVED_CALLBACK_TOKEN" \
            --analysis-url "${{ inputs.analysis_url }}" \
            --audit-bucket "$R2_BUCKET_AUDITS" \
            --audit-public-base-url "$R2_PUBLIC_BASE_URL_AUDITS" \
            --output-dir artifacts/seo-aeo-geo \
            2>&1 | tee artifacts/seo-aeo-geo/workflow.log
          audit_status=${PIPESTATUS[0]}
          set -e
          echo "AUDIT_EXIT_CODE=$audit_status" >> "$GITHUB_ENV"
          exit "$audit_status"

      - name: Notify AIMS if SEO workflow failed before stage callback
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          callback_url = (
              os.environ.get("RESOLVED_CALLBACK_URL", "").strip()
              or os.environ.get("INPUT_CALLBACK_URL", "").strip()
              or os.environ.get("AI_SUITE_AUDIT_CALLBACK_URL", "").strip()
              or "https://app.jonathan-harris.online/audits/seo-aeo-geo/callback"
          )
          token = (
              os.environ.get("RESOLVED_CALLBACK_TOKEN", "").strip()
              or os.environ.get("INPUT_CALLBACK_TOKEN", "").strip()
              or os.environ.get("AUDIT_CALLBACK_TOKEN", "").strip()
              or os.environ.get("AI_SUITE_AUDIT_CALLBACK_TOKEN", "").strip()
          )
          if not callback_url or not token:
              print("::warning::Unable to post fallback callback because URL or token is unavailable")
              raise SystemExit(0)

          log_path = Path("artifacts/seo-aeo-geo/workflow.log")
          detail = log_path.read_text(encoding="utf-8", errors="replace")[-6000:] if log_path.exists() else ""
          detail = re.sub(r"Bearer\s+\S+", "Bearer [masked]", detail)
          detail = re.sub(r"(?:sk-or-|github_pat_)[A-Za-z0-9._-]+", "[masked-token]", detail)

          payload = {
              "auditType": "seo-aeo-geo",
              "sessionId": "${{ inputs.session_id }}",
              "status": "failed",
              "reportPrefix": "${{ inputs.report_prefix }}",
              "message": "SEO/AEO/GEO GitHub workflow failed before a complete stage callback.",
              "error": detail or "GitHub Actions failure before SEO/AEO/GEO stage publication completed",
              "workflowFailure": True,
              "auditExitCode": os.environ.get("AUDIT_EXIT_CODE"),
              "workflowRunUrl": os.environ.get("WORKFLOW_RUN_URL", ""),
          }
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {token}",
              "X-Audit-Callback-Token": token,
          }
          request = urllib.request.Request(callback_url, data=json.dumps(payload).encode(), headers=headers, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Fallback callback posted: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              print(f"::warning::Fallback callback returned HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')[:1000]}")
          except Exception as exc:
              print(f"::warning::Fallback callback failed: {exc}")
          PY

      - name: Upload SEO audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-aeo-geo-${{ inputs.session_id }}
          path: artifacts/seo-aeo-geo
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Clean local temporary SEO audit files
        if: always()
        shell: bash
        run: rm -rf artifacts/seo-aeo-geo
