name: SEO AEO GEO forensic audit
run-name: SEO AEO GEO - ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Audit session id
        required: true
        type: string
      report_prefix:
        description: R2 prefix under brand-assets
        required: true
        type: string
      base_url:
        description: Live base URL
        required: true
        default: https://jonathan-harris.online
        type: string
      exclude_prefixes:
        description: Comma-separated route prefixes to exclude
        required: false
        default: ""
        type: string
      callback_url:
        description: AI Management Suite callback URL
        required: false
        default: https://app.jonathan-harris.online/audits/seo-aeo-geo/callback
        type: string
      analysis_url:
        description: Optional AI Management Suite analysis URL override
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  seo-aeo-geo:
    environment: R2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET_BRAND_ASSETS: brand-assets
      R2_PUBLIC_BASE_URL_BRAND_ASSETS: ${{ secrets.R2_PUBLIC_BASE_URL_BRAND_ASSETS }}
      AUDIT_CALLBACK_TOKEN: ${{ secrets.AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_TOKEN: ${{ secrets.AI_SUITE_AUDIT_CALLBACK_TOKEN }}
      AI_SUITE_AUDIT_CALLBACK_URL: ${{ vars.AI_SUITE_AUDIT_CALLBACK_URL }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check boto3 requests beautifulsoup4 openpyxl

      - name: Resolve AI-suite callback configuration
        shell: bash
        run: |
          set -euo pipefail
          callback_url="${{ inputs.callback_url }}"
          if [ -z "$callback_url" ]; then
            callback_url="$AI_SUITE_AUDIT_CALLBACK_URL"
          fi
          if [ -z "$callback_url" ]; then
            callback_url="https://app.jonathan-harris.online/audits/seo-aeo-geo/callback"
          fi

          callback_token="$AUDIT_CALLBACK_TOKEN"
          if [ -z "$callback_token" ]; then
            callback_token="$AI_SUITE_AUDIT_CALLBACK_TOKEN"
          fi

          if [ -z "$callback_token" ]; then
            echo "::error::AUDIT_CALLBACK_TOKEN is missing from the website repo's GitHub Actions secrets or R2 environment. Koyeb env vars are not visible inside this workflow."
            exit 1
          fi

          case "$callback_url" in
            */audits/seo-aeo-geo/callback) ;;
            *)
              echo "::error::callback_url must end with /audits/seo-aeo-geo/callback; got $callback_url"
              exit 1
              ;;
          esac

          echo "::add-mask::$callback_token"
          echo "RESOLVED_CALLBACK_URL=$callback_url" >> "$GITHUB_ENV"
          {
            echo "RESOLVED_CALLBACK_TOKEN<<__AUDIT_TOKEN__"
            echo "$callback_token"
            echo "__AUDIT_TOKEN__"
          } >> "$GITHUB_ENV"

      - name: Run forensic SEO AEO GEO audit
        run: |
          python scripts/audits/seo_aeo_geo_forensic.py \
            --base-url "${{ inputs.base_url }}" \
            --session-id "${{ inputs.session_id }}" \
            --report-prefix "${{ inputs.report_prefix }}" \
            --exclude-prefixes "${{ inputs.exclude_prefixes }}" \
            --callback-url "$RESOLVED_CALLBACK_URL" \
            --callback-token "$RESOLVED_CALLBACK_TOKEN" \
            --analysis-url "${{ inputs.analysis_url }}"
