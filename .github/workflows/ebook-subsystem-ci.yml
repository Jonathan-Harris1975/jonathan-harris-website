name: Ebook subsystem CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-ebook-subsystem:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run deployment CI pipeline
        run: python scripts/deployment_ci.py

  post-deploy-live-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate-ebook-subsystem
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Wait for the production deploy to catch up
        run: sleep 180

      - name: Verify live crawler publication
        run: python scripts/validate_release.py --strict-post-deploy-live

      - name: Verify live redirect chains
        run: python scripts/maintenance/check_redirect_chains.py
