name: Ebook subsystem CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate-ebook-subsystem:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Run post-deploy notification unit tests
        run: python -m unittest scripts.test_post_deploy_notify

      - name: Run build pipeline
        run: bash build.sh

  post-deploy-live-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate-ebook-subsystem
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Rebuild local release contract to mirror the Pages build
        run: bash build.sh

      - name: Wait for the production deploy to publish the governed crawler contract
        run: python scripts/wait_for_live_release.py --timeout-seconds 600 --interval-seconds 20 --require-content-match --require-redirect-contract

      - name: Verify live crawler publication
        run: python scripts/validate_release.py --workbook jonathan-harris-site-url-inventory-remediated-release-ready.xlsx --strict-post-deploy-live

      - name: Verify live redirect chains
        run: python scripts/maintenance/check_redirect_chains.py

      - name: Notify post-deploy integrations
        if: success()
        timeout-minutes: 5
        env:
          POST_DEPLOY_WEBHOOK_URL: ${{ secrets.POST_DEPLOY_WEBHOOK_URL }}
          CLOUDFLARE_PURGE_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_PURGE_ENDPOINT_URL }}
          CLOUDFLARE_PURGE_SHARED_SECRET: ${{ secrets.CLOUDFLARE_PURGE_SHARED_SECRET }}
          CLOUDFLARE_PURGE_HOSTS: ${{ vars.CLOUDFLARE_PURGE_HOSTS }}
        run: python scripts/post_deploy_notify.py
