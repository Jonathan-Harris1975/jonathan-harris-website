name: Ebook subsystem CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write

jobs:
  validate-ebook-subsystem:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Run build pipeline
        run: bash build.sh

  weekly-podcast-refresh:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild podcast artefacts from the live feed
        run: |
          python3 scripts/sync_podcast_episodes.py
          python3 scripts/generate_podcast_episodes.py
          python3 scripts/sync_podcast_transcripts.py

      - name: Commit weekly podcast refresh if anything changed
        run: |
          if git diff --quiet -- podcast/index.html data/podcast-episodes.json podcast/episodes podcast/TT-*; then
            echo "No podcast changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast/index.html data/podcast-episodes.json podcast/episodes podcast/TT-* 2>/dev/null || true
          git commit -m "chore: weekly podcast refresh"
          git push

  post-deploy-live-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate-ebook-subsystem
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Rebuild local release contract to mirror the Pages build
        run: bash build.sh

      - name: Wait for the production deploy to publish the governed crawler contract
        run: python scripts/wait_for_live_release.py --timeout-seconds 600 --interval-seconds 20 --require-content-match --require-redirect-contract

      - name: Verify live crawler publication
        run: python scripts/validate_release.py --workbook jonathan-harris-site-url-inventory-remediated-release-ready.xlsm --strict-post-deploy-live

      - name: Verify live redirect chains
        run: python scripts/maintenance/check_redirect_chains.py

      - name: Notify post-deploy success webhook
        if: success()
        run: python scripts/post_deploy_notify.py
