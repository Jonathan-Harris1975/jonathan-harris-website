name: Ebook subsystem CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate-ebook-subsystem:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install and validate Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip check

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Run post-deploy notification unit tests
        run: python -m unittest scripts.test_post_deploy_notify

      - name: Run site-shell contract unit tests
        run: python -m unittest scripts.test_build_site_shell

      - name: Run production readiness gate unit tests
        run: python -m unittest scripts.test_wait_for_live_release

      - name: Run live crawler contract unit tests
        run: python -m unittest scripts.test_check_crawlers

      - name: Run manuscript extraction regression tests
        run: python -m unittest scripts.test_sync_manuscript_samples

      - name: Run ebook sample schema regression tests
        run: python -m unittest scripts.test_ebook_sample_schema

      - name: Run compatibility entrypoint regression tests
        run: python -m unittest scripts.test_compatibility_entrypoints

      - name: Run repository hygiene regression tests
        run: python -m unittest scripts.test_repository_hygiene

      - name: Run build pipeline
        run: bash build.sh

  post-deploy-live-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate-ebook-subsystem
    environment:
      name: R2
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify whether this push requires a Pages release
        id: release-impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          release_required=true
          before="${BEFORE_SHA:-}"

          # A push may contain more than one commit, while actions/checkout uses
          # a shallow clone by default. Fetch the previous branch tip explicitly
          # so the classification covers the full push rather than just HEAD~1.
          if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$before" >/dev/null 2>&1 || true

            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              mapfile -t changed_files < <(git diff --name-only "$before" "$GITHUB_SHA")

              if (( ${#changed_files[@]} > 0 )); then
                release_required=false
                for path in "${changed_files[@]}"; do
                  case "$path" in
                    .github/*|docs/*|README.md|SECURITY.md|GHOST_CONTENT_REMOVAL.md|artifacts/*|test_*.py|scripts/test_*.py|scripts/*test*.py|scripts/*test*.mjs)
                      ;;
                    *)
                      release_required=true
                      break
                      ;;
                  esac
                done
              fi

              printf 'Changed files in push:\n'
              printf ' - %s\n' "${changed_files[@]}"
            else
              echo "Previous push SHA is unavailable; requiring an exact Pages release as the safe default."
            fi
          else
            echo "No usable previous push SHA; requiring an exact Pages release as the safe default."
          fi

          echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
          echo "Pages release required: $release_required"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install and validate Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip check

      - name: Remove tracked Python bytecode caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Rebuild local release contract to mirror the Pages build
        run: bash build.sh

      - name: Wait for the exact production release to become live
        if: steps.release-impact.outputs.release_required == 'true'
        run: python scripts/wait_for_live_release.py --timeout-seconds 600 --interval-seconds 20 --require-release-sha --stabilisation-seconds 30 --require-content-match --require-redirect-contract

      - name: Validate the current production release for CI-only changes
        if: steps.release-impact.outputs.release_required == 'false'
        run: python scripts/wait_for_live_release.py --timeout-seconds 120 --interval-seconds 15 --require-content-match --require-redirect-contract

      - name: Verify live crawler publication
        run: python scripts/validate_release.py --workbook jonathan-harris-site-url-inventory-remediated-release-ready.xlsx --strict-post-deploy-live

      - name: Verify live redirect chains
        run: python scripts/check_redirect_chains.py

      - name: Record exact-SHA live website attestation
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"website","status":"post-deployment-live-gate-green"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > website-live-attestation.json
      - name: Retain website deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-live-attestation-${{ github.sha }}
          path: website-live-attestation.json
          if-no-files-found: error
          retention-days: 90


      - name: Run staged Cloudflare purges and notify post-deploy integrations
        if: success()
        timeout-minutes: 25
        env:
          POST_DEPLOY_WEBHOOK_URL: ${{ secrets.POST_DEPLOY_WEBHOOK_URL }}
          CLOUDFLARE_PURGE_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_PURGE_ENDPOINT_URL }}
          CLOUDFLARE_PURGE_SHARED_SECRET: ${{ secrets.CLOUDFLARE_PURGE_SHARED_SECRET }}
          CLOUDFLARE_PURGE_HOSTS: ${{ vars.CLOUDFLARE_PURGE_HOSTS }}
          SITE_SHELL_SYNC_ENDPOINT_URL: ${{ secrets.SITE_SHELL_SYNC_ENDPOINT_URL }}
          SITE_SHELL_SYNC_SHARED_SECRET: ${{ secrets.SITE_SHELL_SYNC_SHARED_SECRET }}
        run: python scripts/post_deploy_notify.py --purge-count 3 --purge-initial-delay-seconds 300 --purge-interval-seconds 300


  open_dependabot_revert:
    name: Open validated Dependabot revert PR
    needs: [validate-ebook-subsystem, post-deploy-live-gate]
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (needs.validate-ebook-subsystem.result == 'failure' || needs.post-deploy-live-gate.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Revert only the failed Dependabot merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr_number="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$FAILED_SHA/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .merged_at != null)] | first | .number // empty')"
          if [ -z "$pr_number" ]; then
            echo "Failed SHA $FAILED_SHA is not a merged Dependabot PR; no automatic revert is created."
            exit 0
          fi

          base_ref="$(gh pr view "$pr_number" --json baseRefName --jq '.baseRefName')"
          title="$(gh pr view "$pr_number" --json title --jq '.title')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$base_ref" --prune
          git checkout -B "$base_ref" "origin/$base_ref"
          git cat-file -e "$FAILED_SHA^{commit}" 2>/dev/null || git fetch origin "$FAILED_SHA"

          branch="automation/revert-dependabot-${pr_number}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          parent_count="$(git rev-list --parents -n 1 "$FAILED_SHA" | awk '{print NF-1}')"
          if [ "$parent_count" -gt 1 ]; then
            git revert -m 1 --no-edit "$FAILED_SHA"
          else
            git revert --no-edit "$FAILED_SHA"
          fi
          git push --set-upstream origin "$branch"

          printf '%s\n\n%s\n\n%s\n' \
            "This PR automatically reverts Dependabot PR #${pr_number} because commit \`${FAILED_SHA}\` failed the website's validation or exact-SHA post-deployment live gate." \
            "Original Dependabot PR: #${pr_number} — ${title}" \
            "The revert is deliberately opened as a PR so normal CI validates recovery before it can merge." \
            > /tmp/revert-body.md
          gh pr create \
            --base "$base_ref" \
            --head "$branch" \
            --title "revert: Dependabot PR #${pr_number} after failed production validation" \
            --body-file /tmp/revert-body.md
