version: 2
updates:
  - package-ecosystem: "pip" # zizmor: ignore[dependabot-cooldown] passive-only: PR creation is disabled; Renovate owns release-age policy
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      audit-tooling:
        patterns:
          - "boto3"
          - "playwright"
          - "requests"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions" # zizmor: ignore[dependabot-cooldown] passive-only: PR creation is disabled; Renovate owns release-age policy
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(ci)"
