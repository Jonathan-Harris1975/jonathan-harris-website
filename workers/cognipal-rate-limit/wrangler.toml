name = "cognipal-rate-limit"
main = "index.js"
compatibility_date = "2026-08-22"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

[[durable_objects.bindings]]
name = "COGNIPAL_RATE_LIMITER"
class_name = "CogniPalRateLimiter"

[exports.CogniPalRateLimiter]
type = "durable-object"
storage = "sqlite"
