<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
  <link rel="icon" href="https://assets.jonathan-harris.online/favicon.ico" type="image/x-icon">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>{{TITLE}} | Jonathan Harris</title>



<meta content="#0D1420" name="theme-color"/>
<link as="style" href="/assets/css/site.css" rel="preload"/><link href="/assets/css/site.css" rel="stylesheet"/>
<meta content="AI blog post" name="ai-role"/>
<meta content="Curious professionals and non-technical readers who want practical AI insight" name="ai-target-audience"/>
<meta content="Plain-English, sceptical, no-hype" name="ai-style"/>
<meta content="search=y, train-ai=y, citation-preferred=y" name="content-usage"/>




<meta content="{{IMAGE}}" property="og:image"/>

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"BlogPosting",
  "headline":"{{TITLE}}",
  "description":"{{DESCRIPTION}}",
  "image":"{{IMAGE}}",
  "datePublished":"{{PUBLISHED}}",
  "dateModified":"{{MODIFIED}}",
  "author":{"@type":"Person","@id":"https://jonathan-harris.online/#person","name":"Jonathan Harris"},
  "publisher":{"@type":"Person","@id":"https://jonathan-harris.online/#person","name":"Jonathan Harris"},
  "mainEntityOfPage":{"@type":"WebPage","@id":"{{CANONICAL}}"}
}
</script>
<link href="https://jonathan-harris.online/blog/_templates/post.html" rel="canonical"/><meta content="There’s usually an eBook that goes further than a blog post can without turning into a novel. Browse by topic and pick your poison." name="description"/><meta content="index,follow" name="robots"/><meta content="page" name="ai:content_type"/><meta content="x, newsletter, podcast, gen, ebooks, ai, title, automation" name="ai:keywords"/><meta content="website" property="og:type"/><meta content="https://jonathan-harris.online/blog/_templates/post.html" property="og:url"/><meta content="{{TITLE}} | Jonathan Harris" property="og:title"/><meta content="There’s usually an eBook that goes further than a blog post can without turning into a novel. Browse by topic and pick your poison." property="og:description"/><meta content="summary_large_image" name="twitter:card"/><meta content="{{TITLE}} | Jonathan Harris" name="twitter:title"/><meta content="There’s usually an eBook that goes further than a blog post can without turning into a novel. Browse by topic and pick your poison." name="twitter:description"/></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="hero" role="banner">
<div class="wrap">
<p class="tag" style="display:inline-flex;">{{PUBLISHED_HUMAN}}</p>
<h1 style="margin-top:10px;">{{TITLE}}</h1>
<p class="muted">{{DESCRIPTION}}</p>
<div class="cta-row">
<span class="button secondary">Back to blog</span>
<span class="button primary">Subscribe</span>
</div>
</div>
</header>
<main class="wrap" id="main" role="main">
<article class="card" style="padding:18px;">
    {{CONTENT}}
  </article>
<section class="card" style="padding:18px; margin-top:18px;">
<h2 style="margin-top:0;">Want the deeper version?</h2>
<p>There’s usually an eBook that goes further than a blog post can without turning into a novel. Browse by topic and pick your poison.</p>
<a class="button secondary" href="/topics/">Browse by topic</a>
</section>
</main>
<div id="siteFooter"></div>
<script src="/assets/js/site-ui.js"></script>
</body>
</html>
