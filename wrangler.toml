# wrangler.toml — Cloudflare Pages project configuration
#
# This file takes ownership of resource bindings (R2, KV, etc.) away from the
# dashboard so they are version-controlled, reproducible, and immune to the
# "invalid jurisdiction" bug that can corrupt dashboard-created bindings.
#
# Build settings (keep in sync with the Pages dashboard):
#   Build command : bash build.sh
#   Output dir    : .
#

name = "jonathan-harris-website"          # Your Pages project name in the dashboard
pages_build_output_dir = "."             # Required: tells CF this is a Pages project
compatibility_date = "2024-09-23"

[[r2_buckets]]
  binding     = "TRANSCRIPTS_BUCKET"    # Must match the variable name used in
                                        # functions/transcripts/[[slug]].js
  bucket_name = "transcripts"

[[r2_buckets]]
  binding     = "BLOG_BUCKET"           # functions/blog/posts.json.js
  bucket_name = "blog"

[[r2_buckets]]
  binding     = "BLOG_IMAGES_BUCKET"    # functions/blog/images/[[slug]].js
  bucket_name = "blog-images"

[[r2_buckets]]
  binding     = "HIVE_SKILLS_BUCKET"   # Read-only shared HIVE skills pool for website metadata/API proxy
  bucket_name = "hive-skills"

[vars]
  R2_PUBLIC_BASE_URL_HIVE_SKILLS = "https://pub-da50a6512f164566955a3076a1c795ef.r2.dev"
  R2_BUCKET_HIVE_SKILLS = "hive-skills"
  HIVE_SKILLS_DEFAULT_MANIFEST = "manifests/website-skills-manifest.json"
  HIVE_SKILLS_ACCESS_MODE = "read_only"
