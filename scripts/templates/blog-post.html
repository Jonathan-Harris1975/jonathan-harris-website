<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
  <link rel="icon" href="https://assets.jonathan-harris.online/favicon.ico" type="image/x-icon">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>{{TITLE_ATTR}} | Jonathan Harris</title>



<meta content="#0D1420" name="theme-color"/>
<link as="style" href="/assets/css/site.css" rel="preload"/><link href="/assets/css/site.css" rel="stylesheet"/>
<meta content="AI blog post" name="ai-role"/>
<meta content="Curious professionals and non-technical readers who want practical AI insight" name="ai-target-audience"/>
<meta content="Plain-English, sceptical, no-hype" name="ai-style"/>
<meta content="search=y, train-ai=y, citation-preferred=y" name="content-usage"/>




<meta content="{{IMAGE_ATTR}}" property="og:image"/>
<meta content="1200" property="og:image:width"/>
<meta content="630" property="og:image:height"/>
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"BlogPosting",
  "headline":{{TITLE_JSON}},
  "description":{{DESCRIPTION_JSON}},
  "image":{{IMAGE_JSON}},
  "datePublished":{{PUBLISHED_JSON}},
  "dateModified":{{MODIFIED_JSON}},
  "author":{"@type":"Person","@id":"https://jonathan-harris.online/#person","name":"Jonathan Harris"},
  "publisher":{"@type":"Person","@id":"https://jonathan-harris.online/#person","name":"Jonathan Harris"},
  "mainEntityOfPage":{"@type":"WebPage","@id":{{CANONICAL_JSON}}}
}
</script>
<link href="{{CANONICAL_ATTR}}" rel="canonical"/>
<meta content="{{DESCRIPTION_ATTR}}" name="description"/>
<meta content="index,follow" name="robots"/>
<meta content="page" name="ai:content_type"/>
<meta content="x, newsletter, podcast, gen, ebooks, ai, title, automation" name="ai:keywords"/>
<meta content="article" property="og:type"/>
<meta content="{{CANONICAL_ATTR}}" property="og:url"/>
<meta content="{{TITLE_ATTR}} | Jonathan Harris" property="og:title"/>
<meta content="{{DESCRIPTION_ATTR}}" property="og:description"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="{{TITLE_ATTR}} | Jonathan Harris" name="twitter:title"/>
<meta content="{{DESCRIPTION_ATTR}}" name="twitter:description"/>
<meta content="{{IMAGE_ATTR}}" name="twitter:image"/>
<link href="/assets/css/ux-fixes.css" rel="stylesheet"/>
<link href="/assets/css/gold-standard.css" rel="stylesheet"/></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="hero" role="banner">
<div class="wrap">
<p class="tag" style="display:inline-flex;">{{PUBLISHED_HUMAN_HTML}}</p>
<h1 style="margin-top:10px;">{{TITLE_HTML}}</h1>
<p class="muted">{{DESCRIPTION_HTML}}</p>
<div class="cta-row">
<a class="button secondary" href="/blog/">Back to blog</a>
<a class="button primary" href="/newsletter/">Subscribe</a>
</div>
</div>
</header>
<main class="wrap" id="main" role="main">
<article class="card" style="padding:18px;">
    {{CONTENT}}
  </article>
<section class="card" style="padding:18px; margin-top:18px;">
<h2 style="margin-top:0;">Want the deeper version?</h2>
<p>There’s usually an eBook that goes further than a blog post can without turning into a novel. Browse by topic and pick your poison.</p>
<a class="button secondary" href="/topics/">Browse by topic</a>
</section>
</main>
<div id="siteFooter"></div>
<script defer src="/assets/js/site-ui.js"></script>
<script defer src="/assets/js/ux-fixes.js"></script>
<script defer src="/assets/js/gold-standard.js"></script>
</body>
</html>
