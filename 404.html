<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link href="https://images.jonathan-harris.online" rel="preconnect"/>
  <link href="https://assets.jonathan-harris.online" rel="preconnect"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Page Not Found | Jonathan Harris</title>
  <meta content="Jonathan Harris" name="author"/>
  <meta content="Page not found. Return to Jonathan Harris Online for AI ebooks, the daily newsletter, and the podcast." name="description"/>
  <meta content="noindex, follow" name="robots"/>
  <meta content="#0D1420" name="theme-color"/>
  <link href="https://assets.jonathan-harris.online/favicon.ico" rel="icon" type="image/x-icon"/>
  <!-- Use the shared site stylesheet for consistent layout and typography -->
  <link href="/assets/css/site.css" rel="stylesheet"/>
  <script defer src="/assets/js/site-ui.js"></script>
</head>
<body class="jh-page-404">

<a class="skip-link" href="#main">Skip to main content</a>

<!-- Shared site header — identical to all other pages -->
<div id="siteHeader"></div>
<script>
  fetch('/components/header.html').then(r=>r.text()).then(h=>{
    document.getElementById('siteHeader').outerHTML = h;
  });
</script>

<main id="main" role="main" aria-label="Page not found">
  <div class="jh-404-layout wrap">

    <!-- Logo -->
    <a href="/" aria-label="Return to homepage">
      <img
        src="https://images.jonathan-harris.online/site-logo"
        alt="Jonathan Harris logo"
        width="80" height="80"
        loading="eager" fetchpriority="high"
        style="width:80px;height:80px;border-radius:14px;display:block;margin:0 auto 24px;box-shadow:0 8px 28px rgba(0,0,0,0.45);"
      />
    </a>

    <!-- Heading hierarchy: H1 → descriptive subtext -->
    <h1 style="text-align:center;color:#93C5FD;margin:0 0 12px;">404 — Page Not Found</h1>
    <p style="text-align:center;max-width:560px;margin:0 auto 24px;color:#D1D5DB;font-size:1.1rem;line-height:1.65;">
      This page doesn't exist or has been moved. Use the search or jump to a popular section below.
    </p>

    <!-- Search — same style as site search -->
    <div class="jh-404-search" role="search" aria-label="Search the site">
      <input
        id="jh404-input"
        type="search"
        placeholder="Try searching…"
        aria-label="Search the site"
        autocomplete="off"
      />
      <button
        type="button"
        onclick="var q=document.getElementById('jh404-input').value.trim();if(q)window.location='/ebooks/?q='+encodeURIComponent(q);"
      >Search</button>
    </div>

    <!-- Primary CTA -->
    <div class="jh-404-ctas" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:28px auto 10px;max-width:600px;">
      <a class="button" href="/ebooks/" style="flex:1 1 140px;text-align:center;">Browse eBooks</a>
      <a class="button secondary" href="/podcast/" style="flex:1 1 140px;text-align:center;">Podcast</a>
      <a class="button secondary" href="/newsletter/" style="flex:1 1 140px;text-align:center;">Newsletter</a>
      <a class="button secondary" href="/glossary/" style="flex:1 1 140px;text-align:center;">Glossary</a>
      <a class="button secondary" href="/bio/" style="flex:1 1 140px;text-align:center;">About</a>
    </div>

    <!-- Illustration — same corner-radius language as site cards -->
    <img
      src="https://images.jonathan-harris.online/404-img"
      alt="Illustration of a lost robot searching for a page"
      loading="lazy"
      style="width:min(440px,88vw);height:auto;border-radius:18px;display:block;margin:32px auto 0;box-shadow:0 18px 60px rgba(0,0,0,0.4);"
    />

  </div>
</main>

<!-- Shared site footer — identical to all other pages -->
<div id="siteFooter"></div>
<script>
  fetch('/components/footer.html').then(r=>r.text()).then(h=>{
    document.getElementById('siteFooter').outerHTML = h;
  });
</script>

</body>
</html>
